apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: fundkit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        # Pod discovery: a prometheus.io/scrape relabel rule turns these three
        # lines into a scrape target, so a new replica is monitored the moment
        # it schedules and nothing has to be added to a static config.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
      labels:
        app: api-gateway
    spec:
      # Longer than the service's own shutdown timeout, so the pod is never
      # SIGKILLed while it is still draining connections.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-gateway
          image: fundkit/api-gateway:latest
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: fundkit-config
            - secretRef:
                name: fundkit-secrets
          env:
            - name: FUNDKIT_HTTP_PORT
              value: "8080"
            - name: FUNDKIT_METRICS_PORT
              value: "9100"
          # Liveness restarts a wedged process; readiness only removes the pod
          # from the Service. Conflating the two turns a slow dependency into a
          # restart loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  type: LoadBalancer
