apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
    app.kubernetes.io/part-of: fundkit
spec:
  # Replica count is bounded by the partition count of order_events: extra
  # consumers in the same group would sit idle with nothing assigned.
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: notification-service
          image: fundkit/notification-service:latest
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: fundkit-config
          env:
            - name: FUNDKIT_HTTP_PORT
              value: "8083"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness follows the Kafka consumer loop, not just the HTTP
          # listener, so a worker with no broker connection is not counted.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8083
      targetPort: http
