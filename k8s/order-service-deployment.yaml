# Engineered by Dhanush C N (github.com/dhanush-cn)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
    app.kubernetes.io/part-of: fundkit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      annotations:
        # Pod discovery: a prometheus.io/scrape relabel rule turns these three
        # lines into a scrape target, so a new replica is monitored the moment
        # it schedules and nothing has to be added to a static config.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
      labels:
        app: order-service
    spec:
      terminationGracePeriodSeconds: 45

      # Schema migrations run as an init container, not on application startup.
      #
      # This is what replaces AutoMigrate in Kubernetes, and the reason it is an
      # init container is the replica count above: with replicas: 2, boot-time
      # migration means two pods executing DDL against one database at the same
      # moment. golang-migrate holds a Postgres advisory lock, so the second
      # would block rather than corrupt — but the pod would sit there failing
      # its readiness probe while it waited, and the failure mode gets worse
      # with every replica added.
      #
      # An init container fails the pod outright if the migration fails, so a
      # bad migration stops the rollout instead of producing a Deployment that
      # is half on the new schema. Kubernetes retries it with the pod's restart
      # policy, and `up` is idempotent, so a retry after a partial network
      # failure is safe.
      #
      # For a large table this belongs in a Job that runs before the rollout
      # rather than in every pod; the init container is right while migrations
      # are fast, which is the case for everything in migrations/ today.
      initContainers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          args:
            - -path=/migrations
            - -database=$(FUNDKIT_MIGRATE_URL)
            - up
          env:
            # Built from the same secret the service reads, so the migration
            # and the application can never be pointed at different databases.
            # x-migrations-table namespaces the bookkeeping: api-gateway shares
            # this database and tracks its own schema separately.
            - name: FUNDKIT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: fundkit-secrets
                  key: FUNDKIT_DB_URL
            - name: FUNDKIT_MIGRATE_URL
              value: $(FUNDKIT_DB_URL)&x-migrations-table=order_service_schema_migrations
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

      volumes:
        # The .sql files are mounted from a ConfigMap generated directly from
        # the migrations directory, so the cluster runs the same bytes that are
        # in the repository and there is no second copy to keep in sync:
        #
        #   make migrate-configmap | kubectl apply -f -
        - name: migrations
          configMap:
            name: fundkit-order-migrations

      containers:
        - name: order-service
          image: fundkit/order-service:latest
          ports:
            - name: http
              containerPort: 8081
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: fundkit-config
            - secretRef:
                name: fundkit-secrets
          env:
            - name: FUNDKIT_HTTP_PORT
              value: "8081"
            - name: FUNDKIT_METRICS_PORT
              value: "9100"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # /readyz checks Postgres and Redis, so a pod that loses its database
          # is pulled out of rotation instead of returning 500s.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8081
      targetPort: http
