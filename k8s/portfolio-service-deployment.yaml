# Engineered by Dhanush C N (github.com/dhanush-cn)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-service
  labels:
    app: portfolio-service
    app.kubernetes.io/part-of: fundkit
spec:
  # One replica, and this is a constraint rather than a capacity decision.
  #
  # Holdings now live in this process's memory, built from the order_events
  # stream. Two replicas in one consumer group are assigned different
  # partitions, so each would hold the positions of the users on its own
  # partitions and nobody else's. A read balanced onto the wrong replica would
  # return an empty portfolio for a customer who owns funds — intermittently,
  # depending on which pod the Service picked, which is close to the worst
  # possible failure to debug.
  #
  # Scaling back up is not a replica-count change; it is the change this
  # repository has been pointing at all along: move HoldingsRepository to
  # Postgres, with the position write and the processed-event insert in one
  # transaction. Shared state makes the replicas interchangeable, and the
  # partition assignment stops being visible to readers at all.
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-service
  template:
    metadata:
      annotations:
        # Pod discovery: a prometheus.io/scrape relabel rule turns these three
        # lines into a scrape target, so a new replica is monitored the moment
        # it schedules and nothing has to be added to a static config.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
      labels:
        app: portfolio-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: portfolio-service
          image: fundkit/portfolio-service:latest
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8082
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: fundkit-config
          env:
            # Its own consumer group, never the shared one: see the note in
            # config.yaml for what sharing it would do.
            - name: FUNDKIT_KAFKA_CONSUMER_GROUP
              value: "fundkit-portfolio-workers"
            # Its own dead-letter topic too. A replay is per-consumer — pushing
            # a parked event back onto order_events would hand it to
            # notification-service as well, so repairing the holdings would
            # send the customer a duplicate email.
            - name: FUNDKIT_KAFKA_DLQ_TOPIC
              value: "order_events_portfolio_dlq"
            - name: FUNDKIT_HTTP_PORT
              value: "8082"
            - name: FUNDKIT_METRICS_PORT
              value: "9100"
            - name: FUNDKIT_GRPC_PORT
              value: "50051"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
spec:
  selector:
    app: portfolio-service
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: http
      port: 8082
      targetPort: http
