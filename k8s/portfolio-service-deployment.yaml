apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-service
  labels:
    app: portfolio-service
    app.kubernetes.io/part-of: fundkit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-service
  template:
    metadata:
      labels:
        app: portfolio-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: portfolio-service
          image: fundkit/portfolio-service:latest
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: fundkit-config
          env:
            - name: FUNDKIT_HTTP_PORT
              value: "8082"
            - name: FUNDKIT_GRPC_PORT
              value: "50051"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
spec:
  selector:
    app: portfolio-service
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: http
      port: 8082
      targetPort: http
