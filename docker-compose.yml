# FundKit local stack
# Engineered by Dhanush C N (github.com/dhanush-cn)
name: fundkit

services:
  # ---------------------------------------------------------------- infrastructure
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    # Kafka retries its Zookeeper connection on its own, so plain start-ordering
    # is enough here and avoids depending on a healthcheck binary that the
    # Zookeeper image may not ship.
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 15
      start_period: 45s

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundkit
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fundkit_db
    ports:
      # Host port shifted to avoid colliding with a locally installed Postgres.
      # Inside the Docker network this is still plain postgres:5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      # Host port shifted to avoid colliding with a locally running Redis.
      # Inside the Docker network this is still plain redis:6379.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- microservices
  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      order-service:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      FUNDKIT_SERVICE_NAME: api-gateway
      FUNDKIT_HTTP_PORT: "8080"
      FUNDKIT_LOG_LEVEL: info
      FUNDKIT_JWT_SECRET: fundkit-local-dev-secret-change-me
      FUNDKIT_JWT_TTL: 24h
      # The gateway owns the identity store and shares the cluster's Postgres.
      FUNDKIT_DB_URL: postgres://fundkit:password@postgres:5432/fundkit_db?sslmode=disable
      FUNDKIT_BCRYPT_COST: "10"
      FUNDKIT_ORDER_SERVICE_URL: http://order-service:8081
      FUNDKIT_ORDER_SERVICE_HEALTH_URL: http://order-service:8081/readyz
      FUNDKIT_PORTFOLIO_SERVICE_HEALTH_URL: http://portfolio-service:8082/readyz
      FUNDKIT_NOTIFICATION_SERVICE_HEALTH_URL: http://notification-service:8083/readyz
      FUNDKIT_CORS_ALLOWED_ORIGINS: http://localhost:5173
      FUNDKIT_RATE_LIMIT_RPS: "5"
      FUNDKIT_RATE_LIMIT_BURST: "10"

  order-service:
    build: ./order-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      FUNDKIT_SERVICE_NAME: order-service
      FUNDKIT_HTTP_PORT: "8081"
      FUNDKIT_LOG_LEVEL: info
      FUNDKIT_DB_URL: postgres://fundkit:password@postgres:5432/fundkit_db?sslmode=disable
      FUNDKIT_REDIS_URL: redis:6379
      FUNDKIT_KAFKA_BROKERS: kafka:9092
      FUNDKIT_KAFKA_ORDER_TOPIC: order_events
      FUNDKIT_IDEMPOTENCY_TTL: 24h
      FUNDKIT_PORTFOLIO_GRPC_URL: portfolio-service:50051

  portfolio-service:
    build: ./portfolio-service
    restart: unless-stopped
    ports:
      - "8082:8082"
      - "50051:50051"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FUNDKIT_SERVICE_NAME: portfolio-service
      FUNDKIT_GRPC_PORT: "50051"
      FUNDKIT_HTTP_PORT: "8082"
      FUNDKIT_LOG_LEVEL: info
      FUNDKIT_REDIS_URL: redis:6379
      FUNDKIT_NAV_CACHE_TTL: 30s

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      FUNDKIT_SERVICE_NAME: notification-service
      FUNDKIT_HTTP_PORT: "8083"
      FUNDKIT_LOG_LEVEL: info
      FUNDKIT_KAFKA_BROKERS: kafka:9092
      FUNDKIT_KAFKA_ORDER_TOPIC: order_events
      FUNDKIT_KAFKA_CONSUMER_GROUP: fundkit-notification-workers

  # ---------------------------------------------------------------- ui
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

  # ---------------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  postgres-data:
