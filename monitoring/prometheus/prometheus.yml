# FundKit scrape configuration
# Engineered by Dhanush C N (github.com/dhanush-cn)
#
# Every service exposes /metrics on port 9100, a dedicated admin listener that
# is separate from the port serving customer traffic. One port convention across
# the fleet is what keeps this file short: adding a fifth service is one more
# five-line block, not a new port to remember.
#
# Targets are DNS names on the compose network, so Prometheus resolves them the
# same way the services resolve each other. In Kubernetes this whole file is
# replaced by kubernetes_sd_configs pod discovery driven by the
# prometheus.io/scrape annotations in k8s/*.yaml.

global:
  # 15s is the interval the dashboards and alert windows below are tuned for.
  # Going faster costs storage and buys nothing: a rate() needs at least four
  # samples in its window to be trustworthy, and every $__rate_interval here is
  # comfortably wider than that.
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: fundkit-local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus watching itself. If this job is the only one up, the problem is
  # the network, not the services.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------------------------------------------------------- the edge
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:9100"]
        labels:
          service: api-gateway
          tier: edge

  # ---------------------------------------------------------------- core services
  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ["order-service:9100"]
        labels:
          service: order-service
          tier: core

  - job_name: portfolio-service
    metrics_path: /metrics
    static_configs:
      - targets: ["portfolio-service:9100"]
        labels:
          service: portfolio-service
          tier: core

  # ---------------------------------------------------------------- async worker
  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:9100"]
        labels:
          service: notification-service
          tier: worker
