<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Dhanush C N" />
    <meta
      name="description"
      content="FundKit Control Center — live demo on sample data. Engineered by Dhanush C N."
    />
    <title>FundKit Control Center — Live demo</title>
    <!-- Theme boot. This runs before the bundle and before first paint, so the
         app never flashes the wrong theme on a reload. It duplicates the
         fallback order in src/lib/theme.ts on purpose: that module cannot be
         imported here without shipping a second request ahead of the bundle,
         which is exactly the delay this script exists to avoid. Keep the two
         in step — the storage key and attribute name are asserted in the
         theme tests. -->
    <script>
      (function () {
        var theme;
        try {
          theme = window.localStorage.getItem('fundkit_theme');
        } catch (error) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
