# FundKit continuous integration
#
# The pipeline is split so that a failure names its own cause: formatting, vet,
# unit tests, type checking, lint, integration tests and the container build are
# separate jobs rather than one long script whose first error hides the rest.
#
# Engineered by Dhanush C N (github.com/dhanush-cn)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push supersedes the run it interrupted: there is no value in finishing
# CI for a commit nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

jobs:
  go:
    name: Go · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Every module is reported independently; one broken service should not
      # mask the state of the other three.
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - order-service
          - portfolio-service
          - notification-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Resolve dependencies
        run: go mod tidy

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race is the point of running tests in CI rather than only locally: the
      # order lifecycle worker and the rate limiter are both concurrent.
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage.out
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

  integration:
    name: Integration (Postgres · Redis · Kafka)
    runs-on: ubuntu-latest
    # The unit jobs are fast and catch most breakage; spending several minutes
    # on real infrastructure only makes sense once they are green.
    needs: [go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The same compose file developers run locally, so a passing pipeline
      # means the documented workflow actually works.
      - name: Start backing services
        run: docker compose up -d postgres redis kafka

      - name: Wait for the stack to become healthy
        run: |
          for attempt in $(seq 1 60); do
            unhealthy=0
            for service in postgres redis kafka; do
              id="$(docker compose ps -q "$service")"
              state="$(docker inspect -f '{{ .State.Health.Status }}' "$id" 2>/dev/null || echo starting)"
              if [ "$state" != "healthy" ]; then
                unhealthy=1
              fi
            done
            if [ "$unhealthy" -eq 0 ]; then
              echo "all backing services are healthy"
              exit 0
            fi
            sleep 5
          done
          echo "backing services did not become healthy in time"
          docker compose ps
          docker compose logs --tail=100
          exit 1

      - name: Run integration suites
        env:
          # Host ports as published by docker-compose.yml.
          FUNDKIT_TEST_DB_URL: postgres://fundkit:password@localhost:5433/fundkit_db?sslmode=disable
          FUNDKIT_TEST_REDIS_URL: localhost:6380
          FUNDKIT_TEST_KAFKA_BROKERS: localhost:29092
        run: |
          set -e
          for service in api-gateway order-service; do
            echo "==> integration tests for $service"
            (cd "$service" && go mod tidy && go test -tags=integration -count=1 ./...)
          done

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4

      # Building every image proves the Dockerfiles still work, which unit tests
      # cannot tell you and which is exactly what breaks after a refactor.
      - name: Build all service images
        run: docker compose build --pull
